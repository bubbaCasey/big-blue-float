name: Update Big Blue pages

on:
  schedule:
    - cron: "17 10 * * *"   # every day, about 6 am Boston time
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:                      # also rebuild when the page code changes
    branches: [main]
    paths: [template.html, build.py, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest MBARI data and rebuild pages
        run: |
          python build.py template.html docs docs/data.json || code=$?
          if [ "${code:-0}" != "0" ] && [ "$code" != "3" ]; then exit $code; fi

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "big-blue-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "New Big Blue data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new profiles today."
          fi
